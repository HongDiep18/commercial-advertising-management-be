services:
  postgres:
    image: postgres:17-alpine
    container_name: vn-buyer-guide-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vn-buyer-guide-api
    restart: unless-stopped
    ports:
      - '${APP_PORT}:3000'
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_PORT: 3000
      DB_HOST: postgres
      DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE}?schema=public
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/v1/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    container_name: vn-buyer-guide-dev
    ports:
      - '${APP_PORT}:3000'
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_PORT: 3000
      DB_HOST: postgres
      DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE}?schema=public
    volumes:
      - .:/app
      - /app/node_modules
    command: npx nest start --watch
    profiles:
      - dev

volumes:
  pgdata:
