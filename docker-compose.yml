services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: vn-buyer-guide-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: vn-buyer-guide-minio
    restart: unless-stopped
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vn-buyer-guide-api
    ports:
      - '${APP_PORT_LOCAL}:${APP_PORT}'
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_PORT: ${APP_PORT}
      DB_HOST: postgres
      DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE}?schema=public
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
    volumes:
      - .:/app
      - /app/node_modules
    command: pnpm start:dev
    profiles:
      - dev

  prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vn-buyer-guide-prod
    restart: unless-stopped
    ports:
      - '${APP_PORT}:${APP_PORT}'
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE}?schema=public
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://localhost:${APP_PORT:-3000}/${API_PREFIX:-api/v1}/health || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    profiles:
      - prod

  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: vn-buyer-guide-crawl4ai
    restart: unless-stopped
    ports:
      - '11236:11236'
    environment:
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN}
    volumes:
      - ./scripts:/app/scripts:ro
    command: python3 /app/scripts/crawl_server.py
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:11236/health']
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
  minio_data: