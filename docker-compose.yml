services:
  postgres:
    image: postgres:17-alpine
    container_name: vn-buyer-guide-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vn-buyer-guide-api
    restart: unless-stopped
    ports:
      - '${APP_PORT}:3000'
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE}?schema=public

  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    container_name: vn-buyer-guide-dev
    ports:
      - '${APP_PORT}:3000'
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE}?schema=public
    volumes:
      - .:/app
      - /app/node_modules
    command: npx nest start --watch
    profiles:
      - dev

volumes:
  pgdata:
