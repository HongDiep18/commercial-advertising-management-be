services:
  postgres:
    image: postgres:17-alpine
    container_name: vn-buyer-guide-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vn-buyer-guide-api
    restart: unless-stopped
    ports:
      - '${APP_PORT}:3000'
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      DB_HOST: postgres

  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    container_name: vn-buyer-guide-dev
    ports:
      - '${APP_PORT}:3000'
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    volumes:
      - .:/app
      - /app/node_modules
    command: npx nest start --watch
    profiles:
      - dev

volumes:
  pgdata:
